/* =========================================================
   地铁图渲染
   ========================================================= */
var tip = document.getElementById('tip');
function showTip(html, x, y){
  tip.innerHTML = html; tip.style.opacity = 1;
  var w = tip.offsetWidth, h = tip.offsetHeight;
  var px = x + 16, py = y + 16;
  if(px + w > window.innerWidth - 12) px = x - w - 16;
  if(py + h > window.innerHeight - 12) py = y - h - 16;
  tip.style.left = px + 'px'; tip.style.top = py + 'px';
}
function hideTip(){ tip.style.opacity = 0; }

var MAX = 746;
(function(){
  var laneTop = 92, gap = 60;
  var x0 = 172, x1 = 1326, span = x1 - x0;
  function X(ch){ return x0 + ch / MAX * span; }
  var H = laneTop + (lines.length - 1) * gap + 44;

  // 统计交汇点（章号被 ≥2 条线共享）
  var cnt = {};
  lines.forEach(function(L){ L.st.forEach(function(ch){ cnt[ch] = (cnt[ch]||0) + 1; }); });
  var inter = {};
  Object.keys(cnt).forEach(function(k){ if(cnt[k] >= 2) inter[k] = true; });

  var s = [];

  // 顶部刻度与竖向网格
  for(var c = 0; c <= 700; c += 100){
    var gx = X(c);
    s.push('<line x1="'+gx.toFixed(1)+'" y1="52" x2="'+gx.toFixed(1)+'" y2="'+(H-30)+'" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>');
    s.push('<text class="axis-t" x="'+gx.toFixed(1)+'" y="42" text-anchor="middle">第'+c+'章</text>');
  }
  var g746 = X(746);
  s.push('<line x1="'+g746.toFixed(1)+'" y1="52" x2="'+g746.toFixed(1)+'" y2="'+(H-30)+'" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>');
  s.push('<text class="axis-t" x="'+g746.toFixed(1)+'" y="42" text-anchor="middle">746</text>');
  s.push('<text class="axis-t" x="'+(x0-8)+'" y="42" text-anchor="end" style="fill:#8a867f">章号</text>');

  // 换乘通道（先画，垫在车道之下）
  lines.forEach(function(L){
    L.st.forEach(function(ch){
      if(!inter[ch]) return;
      var ys = [];
      lines.forEach(function(L2, j){ if(L2.st.indexOf(ch) >= 0) ys.push(laneTop + j*gap); });
      if(ys.length < 2) return;
      var ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys);
      s.push('<line x1="'+X(ch).toFixed(1)+'" y1="'+ymin.toFixed(1)+'" x2="'+X(ch).toFixed(1)+'" y2="'+ymax.toFixed(1)+'" stroke="rgba(232,201,122,0.16)" stroke-width="1.4" stroke-dasharray="3 4"/>');
    });
  });

  // 各条线路（车轨）
  lines.forEach(function(L, i){
    var y = laneTop + i*gap;
    s.push('<g class="lane" data-i="'+i+'">');
    s.push('<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="'+L.color+'" stroke-width="3.2" stroke-linecap="round" opacity="0.9"/>');
    s.push('</g>');
    s.push('<text class="lane-name" data-i="'+i+'" x="'+x0+'" y="'+(y+4)+'" text-anchor="end" fill="'+L.color+'">'+(L.no<10?'0':'')+L.no+' · '+L.name+'</text>');
  });

  // 站点 + 章号标签
  lines.forEach(function(L, i){
    var y = laneTop + i*gap;
    L.st.forEach(function(ch, k){
      var x = X(ch), isInt = !!inter[ch];
      s.push('<g class="st" data-i="'+i+'">');
      if(isInt){
        s.push('<circle cx="'+x.toFixed(1)+'" cy="'+y+'" r="7" fill="#08080c" stroke="'+L.color+'" stroke-width="2.4"/>');
        s.push('<circle cx="'+x.toFixed(1)+'" cy="'+y+'" r="3" fill="'+L.color+'"/>');
      }else{
        s.push('<circle cx="'+x.toFixed(1)+'" cy="'+y+'" r="4.2" fill="'+L.color+'" stroke="#08080c" stroke-width="1.6"/>');
      }
      s.push('<circle cx="'+x.toFixed(1)+'" cy="'+y+'" r="11" fill="transparent"/>');
      s.push('</g>');
      var ly = y + (k % 2 === 0 ? 17 : 30);
      s.push('<text class="st-lab" x="'+x.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="end" transform="rotate(-55 '+x.toFixed(1)+' '+ly.toFixed(1)+')" fill="'+L.color+'" opacity="'+(isInt?0.95:0.6)+'">'+(isInt?'换乘 ':'')+'第'+ch+'章</text>');
    });
  });

  document.getElementById('metro').innerHTML =
    '<svg id="svg" viewBox="0 0 1360 '+H+'" width="100%" role="img" aria-label="庆余年 13 条支线地铁线路图">'+s.join('')+'</svg>';

  // ---- 交互 ----
  var svg = document.getElementById('svg');
  var lanes = Array.prototype.slice.call(svg.querySelectorAll('.lane'));
  var names = Array.prototype.slice.call(svg.querySelectorAll('.lane-name'));
  var sts   = Array.prototype.slice.call(svg.querySelectorAll('.st'));

  function clearActive(){
    lanes.forEach(function(e){e.classList.remove('active');});
    names.forEach(function(e){e.classList.remove('active');});
    sts.forEach(function(e){e.classList.remove('active');});
    svg.classList.remove('has-active');
  }
  function setActive(i){
    svg.classList.add('has-active');
    lanes.forEach(function(e){ e.classList.toggle('active', +e.getAttribute('data-i')===i); });
    names.forEach(function(e){ e.classList.toggle('active', +e.getAttribute('data-i')===i); });
    sts.forEach(function(e){ e.classList.toggle('active', +e.getAttribute('data-i')===i); });
  }
  function nearestCh(ev, L){
    var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    var loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    var best = null, bd = 1e9;
    L.st.forEach(function(ch){ var d = Math.abs(X(ch) - loc.x); if(d < bd){ bd = d; best = ch; } });
    return bd < 42 ? best : null;
  }

  function bindLine(el){
    var i = +el.getAttribute('data-i');
    el.addEventListener('mouseenter', function(){ setActive(i); });
    el.addEventListener('mouseleave', clearActive);
    el.addEventListener('click', function(){ setActive(i); scrollToCard(i); });
  }
  lanes.forEach(bindLine);
  names.forEach(bindLine);

  sts.forEach(function(g){
    var i = +g.getAttribute('data-i');
    g.addEventListener('mouseenter', function(){ setActive(i); });
    g.addEventListener('mousemove', function(ev){
      var L = lines[i], ch = nearestCh(ev, L);
      var html = '<b>支线 '+L.no+' · '+L.name+'</b><br><span class="c">'+(ch!==null?('关键站点 · 第'+ch+'章'):L.rel)+'</span>'+
                 '<br><span style="color:#9c988f">'+L.rel+'</span>';
      showTip(html, ev.clientX, ev.clientY);
    });
    g.addEventListener('mouseleave', function(){ hideTip(); clearActive(); });
    g.addEventListener('click', function(){ setActive(i); scrollToCard(i); });
  });

  // ---- 图例 ----
  document.getElementById('legend').innerHTML = lines.map(function(L,i){
    return '<div class="lg" data-i="'+i+'"><span class="bar" style="background:'+L.color+'"></span>'+
      (L.no<10?'0':'')+L.no+' · '+L.name+'<span style="margin-left:auto;font-size:10px;color:#7c7972">'+L.rel+'</span></div>';
  }).join('');
  Array.prototype.slice.call(document.querySelectorAll('#legend .lg')).forEach(function(el){
    var i = +el.getAttribute('data-i');
    el.addEventListener('mouseenter', function(){ setActive(i); });
    el.addEventListener('mouseleave', clearActive);
    el.addEventListener('click', function(){ setActive(i); scrollToCard(i); });
  });
})();

/* =========================================================
   支线档案卡片
   ========================================================= */
document.getElementById('scards').innerHTML = lines.map(function(L,i){
  return '<div class="scard" id="scard'+i+'" style="border-left-color:'+L.color+'">'+
    '<div class="shead"><span class="no" style="background:linear-gradient(135deg,'+L.color+',#e8c97a)">'+(L.no<10?'0':'')+L.no+'</span>'+
    '<h4>'+L.name+'</h4><em style="background:'+L.color+'">'+L.rel+'</em></div>'+
    '<div class="rows">'+
      '<div class="r"><span class="lb q">起</span><div class="tx">'+L.q+'</div></div>'+
      '<div class="r"><span class="lb c">承</span><div class="tx">'+L.c+'</div></div>'+
      '<div class="r"><span class="lb z">转</span><div class="tx">'+L.z+'</div></div>'+
      '<div class="r"><span class="lb h">合</span><div class="tx">'+L.h+'</div></div>'+
      '<div class="r"><span class="lb j">交汇</span><div class="tx">'+L.j+'</div></div>'+
      '<div class="r re"><span class="lb v">复用</span><div class="tx">'+L.v+'</div></div>'+
    '</div></div>';
}).join('');

function scrollToCard(i){
  var el = document.getElementById('scard'+i);
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}
</script>
